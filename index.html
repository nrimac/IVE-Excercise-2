<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D UI with A-Frame</title>
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Environment -->
      <a-sky color="#ABABAB"></a-sky>

      <!-- Large Screen -->
      <a-entity id="image-entity" visible="true"
        ><a-image id="img-screen" position="0 3 -4" width="4" height="2.5">
        </a-image>
      </a-entity>
      <a-entity id="video-entity" visible="false">
        <a-video
          id="video-screen"
          position="0 3 -4"
          width="4"
          height="2.5"
          color="#F5F"
          src="#videoAsset"
        >
        </a-video>
      </a-entity>

      <!-- Image/Video Buttons -->
      <a-entity id="menu" position="0 1 -3">
        <a-box
          id="image-button"
          position="-1 0 0"
          depth="0.1"
          height="0.5"
          width="0.5"
          color="#4CAF50"
          class="clickable"
          hoverable
          sound="on: click; src: #click-sound"
        >
          <a-text
            value="Images"
            align="center"
            position="0 0.4 0"
            color="#000"
          ></a-text>
        </a-box>
        <a-box
          id="video1"
          position="1 0 0"
          depth="0.1"
          height="0.5"
          width="0.5"
          color="#2196F3"
          class="clickable"
          hoverable
          sound="on: click; src: #click-sound"
        >
          <a-text
            value="Video"
            align="center"
            position="0 0.4 0"
            color="#000"
          ></a-text>
        </a-box>
      </a-entity>

      <!-- Laser Controls -->
      <a-entity laser-controls="hand: right"></a-entity>
      <a-entity laser-controls="hand: left"></a-entity>

      <!-- Hand Tracking Controls -->
      <a-entity hand-tracking-controls="hand: right"></a-entity>
      <a-entity hand-tracking-controls="hand: left"></a-entity>

      <a-entity camera position="0 1.6 0">
        <a-cursor color="yellow" fuse="false"> </a-cursor>
      </a-entity>

      <!-- Assets -->
      <a-assets>
        <img id="image1" src="./media/image1.png" crossorigin="anonymous" />
        <img id="image2" src="./media/image2.png" crossorigin="anonymous" />
        <img id="image3" src="./media/image3.png" crossorigin="anonymous" />

        <video
          id="videoAsset"
          src="./media/video1.mp4"
          autoplay
          loop="true"
        ></video>

        <audio id="click-sound" src="./media/click.wav"></audio>
      </a-assets>
    </a-scene>

    <script defer>
      let counter = 0;

      const imageButton = document.querySelector("#image-button");
      imageButton.addEventListener("mouseenter", () => {
        imageButton.setAttribute("color", "#66BB6A");
      });
      imageButton.addEventListener("mouseleave", () => {
        imageButton.setAttribute("color", "#4CAF50");
      });

      const videoButton = document.querySelector("#video1");
      videoButton.addEventListener("mouseenter", () => {
        videoButton.setAttribute("color", "#42A5F5");
      });
      videoButton.addEventListener("mouseleave", () => {
        videoButton.setAttribute("color", "#2196F3");
      });

      imageButton.addEventListener("click", () => {
        const imgScreen = document.querySelector("#img-screen");
        const videoScreen = document.querySelector("#video-screen");
        imgScreen.parentElement.setAttribute("visible", "true");
        videoScreen.parentElement.setAttribute("visible", "false");

        const video = document.querySelector("#videoAsset");
        video.pause();

        imgScreen.setAttribute("material", "src", `#image${counter + 1}`);
        counter = ++counter % 3;
      });

      videoButton.addEventListener("click", () => {
        counter = 0;
        const imgScreen = document.querySelector("#img-screen");
        const videoScreen = document.querySelector("#video-screen");
        imgScreen.parentElement.setAttribute("visible", "false");
        videoScreen.parentElement.setAttribute("visible", "true");

        const video = document.querySelector("#videoAsset");
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch((error) => {
            console.error("Video playback failed:", error);
          });
        }

        console.log(
          "Video button clicked: " + videoScreen.getAttribute("material").src
        );
        console.log("Video asset:", videoScreen);
      });
    </script>
  </body>
</html>
